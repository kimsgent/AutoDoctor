; AutoDoctor configuration
; Default paths assume the installer deploys to C:\ProgramData\AutoDoctor.
; If your Inno Setup DefaultDirName differs from that location, rewrite the
; [Paths] and [Files] entries during install so they match the final {app}.

[Server]
host = 127.0.0.1
port = 8000

[Paths]
root = C:\ProgramData\AutoDoctor
config = C:\ProgramData\AutoDoctor\config
db = C:\ProgramData\AutoDoctor\db
reports = C:\ProgramData\AutoDoctor\reports
telemetry = C:\ProgramData\AutoDoctor\telemetry
diagnostics = C:\ProgramData\AutoDoctor\diagnostics
logs = C:\ProgramData\AutoDoctor\logs
server = C:\ProgramData\AutoDoctor\server
api = C:\ProgramData\AutoDoctor\server\api
dashboard = C:\ProgramData\AutoDoctor\server\dashboard

[Files]
database = C:\ProgramData\AutoDoctor\db\autodoctor.db
report_html = C:\ProgramData\AutoDoctor\reports\AutoDoctor_Report.html
report_json = C:\ProgramData\AutoDoctor\reports\AutoDoctor_Report.json
log_file = C:\ProgramData\AutoDoctor\logs\autodoctor.log
meta_json = C:\ProgramData\AutoDoctor\server\latest_run.json
api_entrypoint = C:\ProgramData\AutoDoctor\server\api\run_autodoctor.py
service_wrapper = C:\ProgramData\AutoDoctor\server\api\autodoctor_service.py
dashboard_index = C:\ProgramData\AutoDoctor\server\dashboard\index.html

[Service]
name = AutoDoctorAPI
display_name = AutoDoctor Telemetry API
description = AutoDoctor monitoring API service
